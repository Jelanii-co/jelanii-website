    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black:     #1C1C1E;
      --ivory:     #F8F5F0;
      --gold:      #D4AF7F;
      --burgundy:  #4A1C1A;
    }

    html, body {
      height: 100%;
      background-color: var(--black);
      color: var(--ivory);
      overflow-x: hidden;
    }

    /* ── Video background ── */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: grayscale(100%);
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .video-bg video.loaded {
      opacity: 1;
    }

    /* ── Dark overlay over video ── */
    .video-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(28, 28, 30, 0.55) 0%,
        rgba(28, 28, 30, 0.45) 50%,
        rgba(28, 28, 30, 0.75) 100%
      );
      z-index: 1;
    }

    /* ── Grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 2;
    }

    /* ── Layout ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 80px;
      position: relative;
      z-index: 3;
    }

    /* ── Subtle vignette ── */
    .page::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .inner {
      position: relative;
      z-index: 4;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Wordmark ── */
    .wordmark {
      font-family: 'AcademyEngraved', 'Playfair Display', Georgia, serif;
      font-size: clamp(44px, 10vw, 72px);
      letter-spacing: 0.18em;
      color: var(--ivory);
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
      opacity: 0;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    /* ── Gold rule ── */
    .rule {
      width: 48px;
      height: 1px;
      background: var(--gold);
      margin: 32px auto;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }

    /* ── Tagline ── */
    .tagline {
      font-family: 'Montserrat', Helvetica, sans-serif;
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    /* ── Body copy ── */
    .body-copy {
      font-family: 'Montserrat', Helvetica, sans-serif;
      font-size: clamp(12px, 2.5vw, 13px);
      font-weight: 300;
      line-height: 2.1;
      letter-spacing: 0.06em;
      color: var(--ivory);
      text-align: center;
      max-width: 400px;
      margin: 40px auto 0;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards;
    }

    .body-copy em {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      color: var(--gold);
    }

    /* ── Form wrapper ── */
    .form-wrap {
      width: 100%;
      margin-top: 48px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.85s forwards;
    }

    /* ── Klaviyo form overrides ── */
    /* Force our styling over Klaviyo's defaults */
    .klaviyo-form {
      background: transparent !important;
      padding: 0 !important;
    }

    /* ── Fallback manual form (shown if Klaviyo doesn't load) ── */
    .manual-form {
      display: none;
      flex-direction: column;
      gap: 0;
      width: 100%;
    }

    .manual-form input[type="email"] {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(248, 245, 240, 0.25);
      padding: 16px 0;
      font-family: 'Montserrat', Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--ivory);
      outline: none;
      text-align: center;
      transition: border-color 0.3s;
    }

    .manual-form input[type="email"]::placeholder {
      color: rgba(248, 245, 240, 0.3);
      letter-spacing: 0.3em;
      font-size: 10px;
      text-transform: uppercase;
    }

    .manual-form input[type="email"]:focus {
      border-bottom-color: var(--gold);
    }

    .manual-form button {
      margin-top: 28px;
      width: 100%;
      background: transparent;
      border: 1px solid var(--gold);
      padding: 18px 32px;
      font-family: 'Montserrat', Helvetica, sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold);
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .manual-form button:hover {
      background: var(--gold);
      color: var(--black);
    }

    /* ── Collection teaser ── */
    .collection-teaser {
      margin-top: 56px;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
    }

    .collection-teaser .label {
      font-family: 'Montserrat', Helvetica, sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(248, 245, 240, 0.3);
    }

    .collection-teaser .name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(28px, 6vw, 40px);
      font-style: italic;
      color: var(--ivory);
      letter-spacing: 0.05em;
      margin-top: 10px;
      line-height: 1;
    }

    .collection-teaser .season {
      font-family: 'Montserrat', Helvetica, sans-serif;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 12px;
    }

    /* ── Bottom rule ── */
    .bottom-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(212,175,127,0.3), transparent);
      margin-top: 56px;
      opacity: 0;
      animation: fadeUp 1s ease 1.3s forwards;
    }

    /* ── Footer links ── */
    .social {
      margin-top: 32px;
      opacity: 0;
      animation: fadeUp 1s ease 1.4s forwards;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .page {
        padding: 48px 32px 64px;
        justify-content: flex-start;
        padding-top: max(60px, 12vh);
      }
    }
  </style>
</head>
<body>

  <!-- Video background -->
  <div class="video-bg">
    <video autoplay muted loop playsinline preload="auto" id="hero-video">
      <source src="jelanii%20hero%20video.mp4" type="video/mp4">
    </video>
  </div>

  <main class="page">
    <div class="inner">

      <!-- Wordmark -->
      <h1 class="wordmark">JELANII<sup style="font-family:'Montserrat',Helvetica,sans-serif;font-size:0.22em;font-weight:300;letter-spacing:0.05em;vertical-align:super;color:rgba(248,245,240,0.45);margin-left:4px;">TM</sup></h1>

      <!-- Gold rule -->
      <div class="rule"></div>

      <!-- Tagline -->
      <p class="tagline">Grander. Strength.</p>

      <!-- Body copy -->
      <p class="body-copy">
        The first collection is called <em>Still.</em><br>
        It drops Winter 2026.<br>
        You'll know before anyone else.
      </p>

      <!-- Form -->
      <div class="form-wrap">
        <!-- Klaviyo embedded form -->
        <div class="klaviyo-form-YhAWXD"></div>

        <!-- Fallback if Klaviyo doesn't render -->
        <form class="manual-form" id="fallback-form" action="https://manage.kmail-lists.com/ajax/subscriptions/subscribe" method="POST">
          <input type="hidden" name="g" value="Email List">
          <input type="email" name="email" placeholder="Enter your email" required>
          <button type="submit">Request Access to The Reserve</button>
        </form>
      </div>

      <!-- Collection teaser -->
      <div class="collection-teaser">
        <p class="label">Collection No. 01</p>

        <p class="season">Winter 2026</p>
      </div>

      <!-- Bottom divider -->
      <div class="bottom-rule"></div>

      <!-- Footer links -->
      <div class="social">
        <!-- Instagram icon -->
        <a href="https://www.instagram.com/jelanii.co/" target="_blank" rel="noopener" aria-label="JELANII on Instagram" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid rgba(212,175,127,0.35);border-radius:50%;transition:border-color 0.3s,background 0.3s;text-decoration:none;vertical-align:middle;" onmouseover="this.style.borderColor='rgba(212,175,127,0.8)';this.style.background='rgba(212,175,127,0.08)'" onmouseout="this.style.borderColor='rgba(212,175,127,0.35)';this.style.background='transparent'">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4AF7F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.75;">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>

            <circle cx="17.5" cy="6.5" r="1" fill="#D4AF7F" stroke="none"/>

        <!-- Privacy link -->
        <a href="/privacy" style="font-family:'Montserrat',Helvetica,sans-serif;font-size:9px;font-weight:300;letter-spacing:0.4em;text-transform:uppercase;color:rgba(248,245,240,0.25);text-decoration:none;vertical-align:middle;transition:color 0.3s;" onmouseover="this.style.color='rgba(212,175,127,0.7)'" onmouseout="this.style.color='rgba(248,245,240,0.25)'">Privacy</a>
      </div>

    </div>
  </main>

  <script>
    // Fade video in once it can play
    var video = document.getElementById('hero-video');
    if (video) {
      video.addEventListener('canplay', function() {
        video.classList.add('loaded');
      });
      // Fallback — show after 2s regardless
      setTimeout(function() {
        video.classList.add('loaded');
      }, 2000);
    }

    // Klaviyo form fallback logic
    // Watch for Klaviyo rendering with MutationObserver
    var klaviyoDiv = document.querySelector('.klaviyo-form-YhAWXD');
    var fallbackShown = false;

    function showFallback() {
      if (!fallbackShown) {
        fallbackShown = true;
        document.getElementById('fallback-form').style.display = 'flex';
      }
    }

    function hideFallback() {
      if (!fallbackShown) {
        // Klaviyo rendered — make sure fallback stays hidden
        document.getElementById('fallback-form').style.display = 'none';
      }
    }

    if (klaviyoDiv) {
      // Watch for Klaviyo injecting content into the div
      var observer = new MutationObserver(function(mutations) {
        if (klaviyoDiv.children.length > 0) {
          hideFallback();
          observer.disconnect();
        }
      });
      observer.observe(klaviyoDiv, { childList: true, subtree: true });
    }

    // Extended fallback — 8 seconds for slow mobile connections
    setTimeout(function() {
      if (klaviyoDiv && klaviyoDiv.children.length === 0) {
        showFallback();
      }
    }, 8000);

    // Also check at 5s in case Klaviyo rendered but MutationObserver missed it
    setTimeout(function() {
      if (klaviyoDiv && klaviyoDiv.children.length > 0) {
        hideFallback();
      }
    }, 5000);
  </script>
